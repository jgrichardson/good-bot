name: Deploy barometer worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/worker-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Don't fail the entire run if secrets aren't set yet — the worker is opt-in
    # for the project owner, not a launch blocker for the rest of the project.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Check secrets are set
        id: precheck
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — worker will not deploy. Add it at https://github.com/jgrichardson/good-bot/settings/secrets/actions/new"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap KV namespace if placeholder is present
        if: steps.precheck.outputs.deploy == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if ! grep -q "REPLACE_WITH_KV_ID" wrangler.toml; then
            echo "KV namespace already configured — skipping bootstrap."
            exit 0
          fi
          echo "First deploy detected — creating KV namespace 'good-bot-barometer-STATS' via Cloudflare API…"
          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"title": "good-bot-barometer-STATS"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces")
          ID=$(echo "$RESP" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("result",{}).get("id","") if d.get("success") else "")')
          if [ -z "$ID" ]; then
            echo "::error::KV bootstrap failed. CF response:"
            echo "$RESP"
            exit 1
          fi
          echo "Created KV namespace: $ID"
          # Patch wrangler.toml locally for this run (we do NOT commit back to the
          # repo — the placeholder stays in main so a fresh deploy reuses the
          # bootstrap path. Wrangler's deploy step uses the local file as edited.)
          sed -i "s/REPLACE_WITH_KV_ID/$ID/g" wrangler.toml
          sed -i "s/REPLACE_WITH_PREVIEW_KV_ID/$ID/g" wrangler.toml
          echo "wrangler.toml patched for this run."

      - name: Deploy
        if: steps.precheck.outputs.deploy == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Print live worker URL
        if: steps.precheck.outputs.deploy == 'true'
        run: echo "Worker should be live at https://good-bot-barometer.<account>.workers.dev (account-subdomain visible in the deploy output above)"
